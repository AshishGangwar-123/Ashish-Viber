<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Diwali!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #fff;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 4rem;
            margin: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.5rem;
            margin: 0.5rem;
        }
        .lights {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .light {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff700, transparent);
            border-radius: 50%;
            animation: twinkle 1.5s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <h1>Happy Diwali! 🎆</h1>
    <p>May the festival of lights bring joy, prosperity, and happiness to you and your family.</p>
    <div class="lights" id="lights"></div>
    <script>
        // Generate random lights for a festive effect
        const container = document.getElementById('lights');
        const lightCount = 120;
        for (let i = 0; i < lightCount; i++) {
            const div = document.createElement('div');
            div.className = 'light';
            const size = Math.random() * 6 + 4; // 4-10px
            div.style.width = size + 'px';
            div.style.height = size + 'px';
            div.style.top = Math.random() * 100 + '%';
            div.style.left = Math.random() * 100 + '%';
            div.style.animationDuration = (Math.random() * 1 + 1) + 's';
            container.appendChild(div);
        }
    </script>
</body>
</html>
